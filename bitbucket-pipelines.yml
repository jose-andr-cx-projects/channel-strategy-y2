image: python:3.12

pipelines:
  custom:
    export-confluence:
      - step:
          name: Sync Confluence to Bitbucket
          script:
            # Install exporter dependencies.
            - pip install requests beautifulsoup4 markdownify

            # Remove the previous generated snapshot so deleted or moved
            # Confluence pages do not remain as stale repository content.
            - rm -rf "$CONFLUENCE_OUTPUT_DIR"

            # Export the current Confluence hierarchy.
            - python scripts/export_confluence.py

            # Configure the pipeline Git identity.
            - git config user.name "Confluence Sync"
            - git config user.email "confluence-sync@bitbucket.local"

            # Stage generated content.
            - git add "$CONFLUENCE_OUTPUT_DIR"

            # Stop cleanly if nothing has changed.
            - |
              if git diff --cached --quiet; then
                echo "No Confluence changes detected."
                exit 0
              fi

            # Commit and push back to the branch that ran the pipeline.
            - git commit -m "Sync Confluence content"
            - git push origin HEAD:"$BITBUCKET_BRANCH"

          artifacts:
            - exported-confluence/**

    writeback-confluence:
      - variables:
          - name: CONFIRM_WRITEBACK
            default: "NO"
            allowed-values:
              - "NO"
              - "YES"
          - name: CONFLUENCE_WRITEBACK_MANIFEST
            default: "scripts/confluence_writeback_2026-09-21.json"
      - step:
          name: Write reviewed Git changes to Confluence
          script:
            - |
              if [ "$CONFIRM_WRITEBACK" != "YES" ]; then
                echo "Write-back not confirmed. Set CONFIRM_WRITEBACK=YES."
                exit 1
              fi

            # Install write-back and exporter dependencies.
            - pip install requests markdown PyYAML beautifulsoup4 markdownify

            # Write only the explicitly listed, version-checked pages.
            - python scripts/push_confluence.py --manifest "$CONFLUENCE_WRITEBACK_MANIFEST" --apply

            # Re-export Confluence immediately so Bitbucket reflects the
            # organisational source of truth after the write-back.
            - rm -rf "$CONFLUENCE_OUTPUT_DIR"
            - python scripts/export_confluence.py

            # Commit the refreshed Confluence snapshot back to Bitbucket.
            - git config user.name "Confluence Sync"
            - git config user.email "confluence-sync@bitbucket.local"
            - git add "$CONFLUENCE_OUTPUT_DIR"
            - |
              if git diff --cached --quiet; then
                echo "Confluence updated; no snapshot diff detected."
                exit 0
              fi
            - git commit -m "Write back reviewed changes and refresh Confluence snapshot"
            - git push origin HEAD:"$BITBUCKET_BRANCH"

          artifacts:
            - exported-confluence/**
